name: Web ECR build and publish (Mac mini)
run-name: 'Web publish ${{ inputs.request_id }}'

on:
  workflow_call:
    inputs:
      request_id:
        description: Optional caller correlation ID
        type: string
        required: false
        default: ''
      publication_tag:
        description: Release tag holding the reviewed production zone publication (publication.tar.gz)
        type: string
        required: false
        default: ''
      publication_sha256:
        description: SHA-256 of publication.tar.gz, required with publication_tag
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional caller correlation ID
        type: string
        default: ''
      publication_tag:
        description: Release tag holding the reviewed production zone publication (publication.tar.gz)
        type: string
        default: ''
      publication_sha256:
        description: SHA-256 of publication.tar.gz, required with publication_tag
        type: string
        default: ''

permissions: {}

concurrency:
  group: web-ecr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'jaeview/jaeview-web' &&
      github.repository_id == '1384694704' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      AWS_PAGER: ''
      REGISTRY: 357878953679.dkr.ecr.ap-northeast-2.amazonaws.com
      NODE_IMAGE: node@sha256:40cd011b55415bc894e45b02fdd5a5dfde056921b7d23a64c74f80497af48797
      NGINX_IMAGE: nginx@sha256:cc93106876eedec3e662e46adb019cd1d2cfae7ccdeb7eb411eeb932d90e9701
      JAEVIEW_WEB_IMAGE: jaeview-next-web:ci
      JAEVIEW_PROXY_IMAGE: jaeview-next-proxy:ci
      COMPOSE_PROJECT_NAME: jaeview-web-ci
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
      - name: Check the publish role, Docker context and release paths
        env:
          CONFIGURED_ROLE: ${{ vars.JAEVIEW_WEB_ECR_ROLE_ARN }}
        run: |
          printf 'RELEASE_DIR=%s/web-release\nWEB_BUILD_METADATA=%s/web-build.json\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          test "$CONFIGURED_ROLE" = 'arn:aws:iam::357878953679:role/JaeviewWebGitHubEcrPushRole'
          if [ "$(uname -s)" = "Darwin" ]; then
            export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$PATH"
            printf 'PATH=/opt/homebrew/bin:/usr/local/bin:%s/.local/bin:%s\n' "$HOME" "$PATH" >> "$GITHUB_ENV"
            ci_tmp="$HOME/.cache/jaeview-ci-tmp/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-web"
            mkdir -p "$ci_tmp"
            chmod 700 "$ci_tmp"
            printf 'TMPDIR=%s\nORIGIN_CHECK_TMP_ROOT=%s\n' "$ci_tmp" "$ci_tmp" >> "$GITHUB_ENV"
            selected_ctx=""
            for candidate in "${JAEVIEW_RELEASE_DOCKER_CONTEXT:-}" "${DOCKER_CONTEXT:-}" colima-jaeview-release "$(docker context show 2>/dev/null || true)" default orbstack desktop-linux colima; do
              if [ -z "$candidate" ] || [ "$candidate" = "colima-jaeview" ]; then
                continue
              fi
              if docker --context "$candidate" info >/dev/null 2>&1; then
                selected_ctx="$candidate"
                break
              fi
            done
            if [ -z "$selected_ctx" ] && command -v colima >/dev/null 2>&1; then
              prev_ctx=$(docker context show 2>/dev/null || true)
              if colima list 2>/dev/null | awk 'NR>1 {print $1}' | grep -qx "jaeview-release"; then
                colima start --profile jaeview-release
              else
                colima start --profile jaeview-release --arch aarch64 --vm-type vz --vz-rosetta --cpu 4 --memory 8 --disk 60 --mount "$HOME:w"
              fi
              if [ -n "$prev_ctx" ]; then
                docker context use "$prev_ctx" >/dev/null 2>&1 || true
              fi
              if docker --context colima-jaeview-release info >/dev/null 2>&1; then
                selected_ctx="colima-jaeview-release"
              fi
            fi
            if [ -z "$selected_ctx" ] || [ "$selected_ctx" = "colima-jaeview" ]; then
              echo "::error::No usable non-protected Docker context is running on the Mac mini runner"
              exit 1
            fi
            printf 'DOCKER_CONTEXT=%s\n' "$selected_ctx" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install the reviewed production zone publication
        if: inputs.publication_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_TAG: ${{ inputs.publication_tag }}
          PUBLICATION_SHA256: ${{ inputs.publication_sha256 }}
        run: |
          rm -rf web/.generated
          [[ "$PUBLICATION_TAG" =~ ^publication-prod-[a-z0-9-]{1,64}$ ]]
          [[ "$PUBLICATION_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test ! -e web/.generated
          dir=$(mktemp -d "$RUNNER_TEMP/publication.XXXXXX")
          gh release download "$PUBLICATION_TAG" --repo "$GITHUB_REPOSITORY" --pattern publication.tar.gz --dir "$dir"
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const actual = crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex");
            if (actual !== process.env.PUBLICATION_SHA256) {
              console.error(`SHA-256 mismatch: expected ${process.env.PUBLICATION_SHA256}, got ${actual}`);
              process.exit(1);
            }
          ' "$dir/publication.tar.gz"
          tar -tzvf "$dir/publication.tar.gz" | awk '$1 !~ /^[-d]/ { bad=1 } END { exit bad }'
          tar -tzf "$dir/publication.tar.gz" | grep -Ev '^(zone-documents\.json|home-moves\.json|zone-card-publications/|zone-card-publications/manifest\.json|zone-card-publications/[a-z0-9]+(-[a-z0-9]+)*\.json)$' && exit 1
          mkdir -p web/.generated
          tar -xzf "$dir/publication.tar.gz" -C web/.generated --no-same-owner --no-same-permissions
          test ! -e web/.generated/ci-publication.json

      - name: Require successful CI for this commit or its nearest code commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy/control.mjs require-ci

      - name: Build clean linux amd64 web images
        run: |
          node --test scripts/next-web/ecr-release.test.mjs scripts/next-web/preflight-scan.test.mjs
          node scripts/migration/check-integration-candidate.mjs
          node scripts/next-web/prepare-context.mjs > "$WEB_BUILD_METADATA"
          context=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.WEB_BUILD_METADATA)).context')
          build_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.WEB_BUILD_METADATA)).buildId')
          node -e 'const m=JSON.parse(require("fs").readFileSync(process.env.WEB_BUILD_METADATA)); if(m.dirty || m.revision!==process.env.GITHUB_SHA) process.exit(1)'
          docker build --platform linux/amd64 --provenance=false \
            --build-arg NODE_IMAGE="$NODE_IMAGE" --build-arg WEB_BUILD_ID="$build_id" \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            -f "$context/deploy/next-web/Dockerfile" -t "$JAEVIEW_WEB_IMAGE" "$context"
          docker build --platform linux/amd64 --provenance=false \
            --build-arg NGINX_IMAGE="$NGINX_IMAGE" \
            -f "$context/deploy/next-web/proxy.Dockerfile" -t "$JAEVIEW_PROXY_IMAGE" "$context/deploy/next-web"

      - name: Verify isolated web runtime before publishing
        run: |
          docker compose -f deploy/next-web/compose.yaml up -d --wait --wait-timeout 150
          NEXT_SMOKE_ORIGIN=http://127.0.0.1:18081 node scripts/next-web/smoke.mjs
          node scripts/next-web/ecr-release.mjs record "$RELEASE_DIR"
          docker compose -f deploy/next-web/compose.yaml down -v
          node scripts/next-web/origin-smoke.mjs

      - name: Scan local OS packages before AWS authentication
        run: |
          scanner_dir=$(mktemp -d "$RUNNER_TEMP/trivy.XXXXXX")
          trap 'rm -rf -- "$scanner_dir"' EXIT
          if [ "$(uname -s)" = "Darwin" ]; then
            trivy_asset="trivy_0.76.0_macOS-ARM64.tar.gz"
          else
            trivy_asset="trivy_0.76.0_Linux-64bit.tar.gz"
          fi
          base_url="https://github.com/aquasecurity/trivy/releases/download/v0.76.0"
          curl --fail --location --retry 3 --proto '=https' \
            "${base_url}/${trivy_asset}" \
            --output "$scanner_dir/$trivy_asset"
          curl --fail --location --retry 3 --proto '=https' \
            "${base_url}/trivy_0.76.0_checksums.txt" \
            --output "$scanner_dir/checksums.txt"
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const [dir, asset] = process.argv.slice(1);
            const sums = fs.readFileSync(`${dir}/checksums.txt`, "utf8").split("\n");
            const line = sums.find((l) => l.endsWith(`  ${asset}`));
            const expected = line ? line.split(/\s+/)[0] : "";
            if (!/^[a-f0-9]{64}$/.test(expected)) throw Error("Checksum entry missing");
            const actual = crypto.createHash("sha256").update(fs.readFileSync(`${dir}/${asset}`)).digest("hex");
            if (actual !== expected) throw Error(`Trivy SHA-256 mismatch: ${actual} !== ${expected}`);
          ' "$scanner_dir" "$trivy_asset"
          tar -xzf "$scanner_dir/$trivy_asset" -C "$scanner_dir" trivy
          TRIVY_BIN="$scanner_dir/trivy" node scripts/next-web/preflight-scan.mjs "$RELEASE_DIR"

      - name: Authenticate for ECR upload
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.JAEVIEW_WEB_ECR_ROLE_ARN }}
          aws-region: ap-northeast-2
          audience: sts.amazonaws.com
          allowed-account-ids: '357878953679'
          role-session-name: web-publish-${{ github.run_id }}
          role-duration-seconds: 1800
          retry-max-attempts: 2
          action-timeout-s: 90
          unset-current-credentials: true
          translate-env-variables: false
          output-credentials: false

      - name: Publish immutable image versions
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/ecr-login.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "$REGISTRY"
          node scripts/next-web/ecr-release.mjs publish "$RELEASE_DIR"

      - name: Collect and gate basic OS vulnerability scans
        run: node scripts/next-web/ecr-release.mjs scan "$RELEASE_DIR"

      - name: Save release and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-release/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up CI containers
        if: always()
        run: |
          if test -f deploy/next-web/compose.yaml; then
            docker compose -f deploy/next-web/compose.yaml down -v
          fi

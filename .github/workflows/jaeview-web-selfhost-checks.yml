name: Self-hosted migration checks (Mac mini)
on:
  workflow_call:
    inputs:
      full:
        description: Run SQL, deployment rehearsal and production containers
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      full:
        description: Run SQL, deployment rehearsal and production containers
        type: boolean
        default: true
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: selfhost-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    if: github.repository == 'jaeview/jaeview-web'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    outputs:
      code: ${{ steps.scope.outputs.code }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Configure Mac runner environment
        run: bash scripts/ci/setup-mac-runner.sh setup ci no-docker
      - name: Select validation scope
        id: scope
        run: node scripts/ci/scope.mjs
      - name: Check CI scope policy
        run: node --test scripts/ci/scope.test.mjs
      - name: Integration candidate check (PR and /check full use --pr; main/develop/queue enforce strict pin)
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main || "${{ github.ref }}" == refs/heads/develop || "${{ github.ref }}" == refs/heads/_mq/* ]]; then
            node scripts/migration/check-integration-candidate.mjs
          else
            node scripts/migration/check-integration-candidate.mjs --pr
          fi

  static-unit:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Configure Mac runner environment
        run: bash scripts/ci/setup-mac-runner.sh setup ci no-docker
      - name: Install pinned pnpm for this job
        run: |
          pnpm_prefix=$(mktemp -d "$RUNNER_TEMP/jaeview-pnpm.XXXXXX")
          npm install --global --prefix "$pnpm_prefix" pnpm@12.15.0 --ignore-scripts --no-audit --no-fund
          printf '%s\n' "$pnpm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked data-analysis MCP dependencies
        run: npm --prefix .agents/skills/data-analysis/scripts ci --ignore-scripts --no-audit --no-fund
      - name: Check changed code and formatting
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$CHANGE_BASE"
          if [[ ! "$base" =~ ^[a-f0-9]{40}$ || "$base" =~ ^0+$ ]]; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD^)
          fi
          export QUALITY_BASE_SHA="$base"
          pnpm run test:quality
          node --test scripts/checks/next-only-policy.test.mjs scripts/ci/setup-mac-runner.test.mjs
          pnpm run lint:changed
          pnpm run format:check
      - name: Restore verified public publication for CI only
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/ci/prepare-publication.test.mjs
          if [ "${GITHUB_ACTIONS:-}" = true ]; then
            node scripts/ci/prepare-publication.mjs
          fi
      - name: Check web, API and operations types and unit suites
        run: |
          pnpm run typecheck:all
          pnpm --filter @jaeview/api test
          node --import tsx server/tests/db-pool.ts
          node --import tsx server/tests/pg-numbers.ts
          node scripts/checks/check-domain-boundaries.mjs
          node --import tsx server/tests/domain-api.ts
          node --import tsx server/tests/info-hub-snapshot.ts
          node --import tsx server/tests/community-snapshot.ts
          node --import tsx server/tests/community-events.ts
          node --import tsx server/tests/notion-post-intro.ts
          node --import tsx server/tests/zone-document-publication.ts
          node --import tsx server/tests/home-rankings-swr.ts
          node --import tsx server/tests/zone-trade-counts.ts
          node scripts/run-test.mjs server/tests/zone-market-summary.ts
          node scripts/run-test.mjs server/tests/supply-plan-resolve.ts
          node scripts/run-test.mjs server/tests/zone-value-pool.ts
          node scripts/run-test.mjs server/tests/zone-stage-checklist.ts
          node scripts/run-test.mjs server/tests/zone-market-price.ts
          node --import tsx server/tests/domain-building-facts.ts
          node scripts/run-test.mjs server/tests/zone-news-matches.ts
          node scripts/run-test.mjs server/tests/zone-stage-presentation.ts
          node scripts/run-test.mjs server/tests/zone-stage-regression.ts
          node scripts/run-test.mjs server/tests/zone-stage-pace.ts
          node scripts/run-test.mjs server/tests/redev-stats.ts
          node scripts/run-test.mjs server/tests/knowledge-intuitive.ts
          TZ=UTC node scripts/run-test.mjs server/tests/zone-key-facts.ts
          TZ=UTC node --import tsx --test server/tests/homeMoves.test.ts
          node scripts/run-test.mjs server/tests/zone-document-release.ts
          node scripts/run-test.mjs server/tests/zone-document-publication-cli.ts
          node scripts/run-test.mjs server/tests/zone-document-source.ts
          node scripts/run-test.mjs server/tests/zone-published-sections.ts
          node scripts/run-test.mjs server/tests/zone-sections.ts
          node scripts/run-test.mjs server/tests/zone-auto-slugs.ts
          node scripts/run-test.mjs server/tests/zone-wiki-document.ts
          node scripts/run-test.mjs server/tests/land-use-mix-far.ts
          node scripts/run-test.mjs server/tests/zone-gosi-files.ts
          node scripts/run-test.mjs server/tests/zone-gosi-model.ts
          node scripts/run-test.mjs server/tests/zone-name-region-scope.ts
          node scripts/run-test.mjs server/tests/investment-calculation.ts
          node scripts/run-test.mjs server/tests/investment-api.ts
          node scripts/run-test.mjs server/tests/investment-acquisition.ts
          node scripts/run-test.mjs server/tests/acquisition-tax.ts
          node scripts/run-test.mjs server/tests/investment-precision.ts
          node scripts/run-test.mjs server/tests/simulator-insights.ts
          node scripts/run-test.mjs server/tests/simulator-market-context.ts
          node scripts/run-test.mjs server/tests/trade-analytics-api.ts
          node scripts/run-test.mjs server/tests/self-test-calculation.ts
          pnpm --dir server exec tsc -p poc/agentcore/tsconfig.json
          node --import tsx --test server/poc/agentcore/test.ts
      - name: Check independent runtime and client behavior
        run: |
          node --test scripts/deploy/control.test.mjs
          node --test deploy/remote/*.test.mts scripts/deploy/*.test.mts
          node --test scripts/deploy/publication-stage-regression.test.mjs scripts/deploy/stage-smoke.test.mjs scripts/deploy/publication-guard.test.mjs scripts/deploy/publication-guard-archive.test.mjs scripts/deploy/publication-health.test.mjs
          node --test scripts/ci/merge-queue.test.mjs
          pnpm run test:independence
          node tests/platform/test-independence-policy.mjs
          node scripts/migration/test-schema-manifest.mjs
          node scripts/migration/test-candidate-binding.mjs
          node scripts/migration/test-workspace-inputs.mjs
          node tests/platform/test-web-entrypoints.mjs
          python3 docs/migration/recalculate-progress.py
          node scripts/run-test.mjs web/tests/zones/test-verified-zone-stages.mts
          pnpm run test:migration-status
          node --test scripts/next-web/ecr-release.test.mjs scripts/next-web/preflight-scan.test.mjs
          pnpm run test:mobile-pinned
          node scripts/run-test.mjs web/tests/ai/test-ai-chat-history.mts
          node scripts/run-test.mjs web/tests/simulator/test-redev-calc.mts
          node scripts/run-test.mjs tests/platform/test-source-sync-20261018.mts
          node scripts/run-test.mjs tests/platform/test-source-sync-20261020.mts
          node scripts/run-test.mjs web/tests/map/test-map-overlay.mts
          node scripts/run-test.mjs tests/map/test-dev-zones.mts
          node scripts/run-test.mjs web/tests/map/test-parcel-prices.mts
          node scripts/run-test.mjs web/tests/map/test-map-zone-metrics.mts
          node scripts/run-test.mjs web/tests/home/test-home-zone-metrics.mts
          node scripts/run-test.mjs web/tests/simulator/test-compare-zone-facts.mts
          node scripts/run-test.mjs web/tests/simulator/test-compare-buy-timeline.mts
          node scripts/run-test.mjs tests/map/test-rebuild-draft-builder.mts
          node scripts/run-test.mjs tests/platform/test-public-artifacts-guard.ts
          node scripts/migration/check-fixed-functional.mjs
          node --import tsx server/tests/operations-control.ts
          node --import tsx server/tests/deployment-configuration.ts
          node --import tsx server/tests/deployment-cli.ts
          node --import tsx server/tests/backup-transport.ts
          node --import tsx server/tests/backup-envelope.ts
          node --import tsx server/tests/checkpoint-backup.ts
          node --import tsx server/tests/nonres-csv.ts
      - name: Clean generated workspace artifacts
        if: always()
        run: rm -rf web/.generated web/.next

  next-playwright:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Configure Mac runner environment
        run: bash scripts/ci/setup-mac-runner.sh setup ci no-docker
      - name: Install pinned pnpm for this job
        run: |
          pnpm_prefix=$(mktemp -d "$RUNNER_TEMP/jaeview-pnpm.XXXXXX")
          npm install --global --prefix "$pnpm_prefix" pnpm@12.15.0 --ignore-scripts --no-audit --no-fund
          printf '%s\n' "$pnpm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium and browser test environment
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { fileURLToPath } from 'node:url';
          import { chromium } from 'playwright';
          console.log(`PLAYWRIGHT_MODULE=${fileURLToPath(import.meta.resolve('playwright'))}`);
          console.log(`CHROME_PATH=${chromium.executablePath()}`);
          NODE
      - name: Restore verified public publication for CI only
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/prepare-publication.mjs
      - name: Check stage corrections and Next production runtime
        run: |
          node scripts/checks/check-zone-safety.mjs
          node scripts/run-test.mjs web/tests/zones/test-stage-date-cache.mts
          pnpm run build
          pnpm run typecheck:next
          next_port=$(bash scripts/ci/setup-mac-runner.sh allocate-port)
          next_log="$RUNNER_TEMP/jaeview-next-$next_port.log"
          set -m
          JAEVIEW_WEB_PORT="$next_port" pnpm run start > "$next_log" 2>&1 &
          next_pid=$!
          set +m
          trap 'kill -- -"$next_pid" 2>/dev/null || kill "$next_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${next_port}/healthz" > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          NEXT_SMOKE_PORT="$next_port" node scripts/next-web/smoke.mjs || NEXT_SMOKE_PORT="$next_port" node scripts/next-web/smoke.mjs
          NEXT_SMOKE_PORT="$next_port" node scripts/run-test.mjs web/tests/browser/test-static-public-pages.mjs
          node scripts/run-test.mjs web/tests/browser/test-simulator-insights-browser.mjs
          node scripts/run-test.mjs web/tests/browser/test-trade-analytics-browser.mjs
      - name: Clean Next build caches
        if: always()
        run: rm -rf web/.generated web/.next

  contracts:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Configure Mac runner environment
        run: bash scripts/ci/setup-mac-runner.sh setup ci no-docker
      - name: Install pinned pnpm for this job
        run: |
          pnpm_prefix=$(mktemp -d "$RUNNER_TEMP/jaeview-pnpm.XXXXXX")
          npm install --global --prefix "$pnpm_prefix" pnpm@12.15.0 --ignore-scripts --no-audit --no-fund
          printf '%s\n' "$pnpm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked data-analysis MCP dependencies
        run: npm --prefix .agents/skills/data-analysis/scripts ci --ignore-scripts --no-audit --no-fund
      - name: Restore verified public publication for CI only
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/prepare-publication.mjs
      - name: Compare offline matching with the pre-refactor corpus
        if: needs.scope.outputs.full == 'true'
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/data/test_offline_pipelines.py --full-corpus
      - name: Complete client and native contract regressions
        env:
          JAEVIEW_TEST_CONCURRENCY: '4'
        run: pnpm test
      - name: Clean generated workspace artifacts
        if: always()
        run: rm -rf web/.generated

  docker-verify:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        task: [fresh-sql, stack-rehearsal, prod-containers]
    env:
      JAEVIEW_SCHEMA_API_PLATFORM: linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Configure Mac runner and Docker context
        run: bash scripts/ci/setup-mac-runner.sh setup ci docker
      - name: Restore verified public publication for CI only
        if: matrix.task != 'fresh-sql'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/prepare-publication.mjs
      - name: Fresh SQL, narrow permissions, API and OAuth recovery
        if: matrix.task == 'fresh-sql'
        run: |
          slot=$(bash scripts/ci/setup-mac-runner.sh docker-slot acquire fresh-sql)
          trap 'bash scripts/ci/setup-mac-runner.sh docker-slot release "$slot"' EXIT
          node --test server/tests/init-independent-db.test.mjs
          JAEVIEW_SCHEMA_API_IMAGE="jaeview-schema-api:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          JAEVIEW_SCHEMA_CLEAN_IMAGE=1 \
            bash server/tests/fresh-schema.sh
      - name: Full local Next, proxy, API and database deployment rehearsal
        if: matrix.task == 'stack-rehearsal'
        run: |
          slot=$(bash scripts/ci/setup-mac-runner.sh docker-slot acquire)
          compose_bin="${RUNNER_TEMP:-/tmp}/jaeview-compose-$$"
          trap 'rm -f "$compose_bin"; bash scripts/ci/setup-mac-runner.sh docker-slot release "$slot"' EXIT
          cat > "$compose_bin" <<'SH'
          #!/bin/sh
          exec docker compose "$@"
          SH
          chmod +x "$compose_bin"
          JAEVIEW_COMPOSE_BIN="$compose_bin" \
          JAEVIEW_STACK_BUILD_ID="ci-${{ github.sha }}" \
          JAEVIEW_STACK_REVISION="${{ github.sha }}" \
            node server/scripts/test-selfhost-stack.mjs --run
      - name: Build and verify production web and proxy containers
        if: matrix.task == 'prod-containers'
        run: |
          slot=$(bash scripts/ci/setup-mac-runner.sh docker-slot acquire)
          web_tag="jaeview-ci-web:${{ github.run_id }}-${{ github.run_attempt }}"
          proxy_tag="jaeview-ci-proxy:${{ github.run_id }}-${{ github.run_attempt }}"
          next_ctx_file="${RUNNER_TEMP:-/tmp}/next-context-$$.json"
          context=""
          cleanup() {
            rm -rf "$context" "$next_ctx_file"
            docker rmi -f "$web_tag" "$proxy_tag" >/dev/null 2>&1 || true
            bash scripts/ci/setup-mac-runner.sh docker-slot release "$slot"
          }
          trap cleanup EXIT
          node --test scripts/next-web/prepare-context.test.mjs
          node scripts/next-web/test-web-unavailable.mjs
          node scripts/next-web/prepare-context.mjs --ci-validation > "$next_ctx_file"
          context=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).context" "$next_ctx_file")
          docker build --platform linux/amd64 --build-arg "WEB_BUILD_ID=ci-${{ github.sha }}" --build-arg "SOURCE_REVISION=${{ github.sha }}" -f "$context/deploy/next-web/Dockerfile" -t "$web_tag" "$context"
          docker build --platform linux/amd64 -f deploy/next-web/proxy.Dockerfile -t "$proxy_tag" deploy/next-web
          JAEVIEW_WEB_IMAGE="$web_tag" JAEVIEW_PROXY_IMAGE="$proxy_tag" node scripts/next-web/origin-smoke.mjs
      - name: Clean generated workspace artifacts
        if: always()
        run: rm -rf web/.generated web/.next .local-migration/selfhost-tests

  verify:
    needs: [scope, static-unit, next-playwright, contracts, docker-verify]
    if: always()
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Confirm required parallel CI results
        run: |
          test "${{ needs.scope.result }}" = "success"
          if [ "${{ needs.scope.outputs.code }}" = "true" ]; then
            test "${{ needs.static-unit.result }}" = "success"
            test "${{ needs.next-playwright.result }}" = "success"
            test "${{ needs.contracts.result }}" = "success"
          fi
          if [ "${{ needs.scope.outputs.full }}" = "true" ]; then
            test "${{ needs.docker-verify.result }}" = "success"
          fi

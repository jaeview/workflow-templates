name: Workspace tools CI (Mac mini self-hosted)
on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version to use
        type: string
        required: false
        default: '26.12.1'
      pnpm_version:
        description: pnpm version to install
        type: string
        required: false
        default: '12.16.1'
  workflow_dispatch:
    inputs:
      node_version:
        description: Node.js version to use
        type: string
        required: false
        default: '26.12.1'
      pnpm_version:
        description: pnpm version to install
        type: string
        required: false
        default: '12.16.1'

permissions:
  contents: read

concurrency:
  group: workspace-tools-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version || '26.12.1' }}
      - name: Install pinned pnpm for this job
        env:
          PNPM_VERSION: ${{ inputs.pnpm_version || '12.16.1' }}
        run: |
          pnpm_prefix=$(mktemp -d "$RUNNER_TEMP/workspace-tools-pnpm.XXXXXX")
          npm install --global --prefix "$pnpm_prefix" "pnpm@$PNPM_VERSION" --ignore-scripts --no-audit --no-fund
          printf '%s\n' "$pnpm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check TypeScript types
        run: pnpm run typecheck
      - name: Run unit and contract tests
        run: pnpm test

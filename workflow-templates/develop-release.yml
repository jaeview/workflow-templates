name: Develop verified images (Mac mini)
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [develop]
permissions:
  contents: read
  packages: read
concurrency:
  group: develop-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'jaeview/jaeview-web' && (github.event_name != 'push' || github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/selfhost-migration-checks.yml
  publish:
    needs: verify
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      TEST_POSTGIS_IMAGE: jaeview-dev-postgis-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_DB_IMAGE: jaeview-dev-db-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_API_IMAGE: ghcr.io/jaeview/jaeview-dev-api:${{ github.sha }}-${{ github.run_attempt }}
      TEST_WEB_IMAGE: ghcr.io/jaeview/jaeview-dev-web:${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Configure Mac runner Docker context and temp paths
        run: bash scripts/ci/setup-mac-runner.sh setup release docker
      - name: Restore verified public zone publication for context preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy/install-publication.mts
      - name: Final test context after public environment replacement
        id: context
        run: node deploy/test/shared-oci/auto/release.mjs context
      - name: Build exact ARM64 images and run verification smokes inside Docker slot
        env:
          WEB_CONTEXT: ${{ steps.context.outputs.context }}
          BUILD_ID: ${{ steps.context.outputs.build }}
          TEST_WEB_BUILD_ID: ${{ steps.context.outputs.build }}
          TEST_GATE_IMAGE: ${{ env.TEST_API_IMAGE }}
        run: |
          slot=$(bash scripts/ci/setup-mac-runner.sh docker-slot acquire)
          trap 'bash scripts/ci/setup-mac-runner.sh docker-slot release "$slot"' EXIT
          docker build --platform linux/arm64 --label org.opencontainers.image.source=https://github.com/jaeview/jaeview-web --build-arg WEB_BUILD_ID="$BUILD_ID" --build-arg SOURCE_REVISION="$GITHUB_SHA" -f "$WEB_CONTEXT/deploy/next-web/Dockerfile" -t "$TEST_WEB_IMAGE" "$WEB_CONTEXT"
          docker build --platform linux/arm64 --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source=https://github.com/jaeview/jaeview-web -f server/Dockerfile -t "$TEST_API_IMAGE" .
          docker build --platform linux/arm64 -f deploy/postgis/Dockerfile -t "$TEST_POSTGIS_IMAGE" .
          docker build --platform linux/arm64 --build-arg POSTGIS_IMAGE="$TEST_POSTGIS_IMAGE" -f deploy/test/shared-oci/db.Dockerfile -t "$TEST_DB_IMAGE" .
          node --test --test-concurrency=2 --test-reporter=spec \
            deploy/test/shared-oci/stack-smoke.mjs \
            deploy/test/shared-oci/live-read-smoke.mjs \
            deploy/test/shared-oci/access-smoke.mjs
          py_bin="python3"
          if ! "$py_bin" -c 'import cryptography' >/dev/null 2>&1; then
            if [ "$(uname -s)" = "Darwin" ]; then
              venv_dir="$RUNNER_TEMP/py-cryptography-venv"
              python3 -m venv "$venv_dir"
              "$venv_dir/bin/pip" install --quiet --disable-pip-version-check cryptography
              py_bin="$venv_dir/bin/python3"
            else
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends python3-cryptography
            fi
          fi
          "$py_bin" -m unittest discover -s deploy/test/shared-oci/auto -p 'test_*.py'
      - name: Publish private containers only after verification
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          node deploy/test/shared-oci/auto/release.mjs registry-preflight
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$TEST_WEB_IMAGE"
          docker push "$TEST_API_IMAGE"
          node deploy/test/shared-oci/auto/release.mjs manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jaeview-release/
          retention-days: 1
          if-no-files-found: error
      - name: Clean up ephemeral dev CI images
        if: always()
        run: docker rmi -f "$TEST_DB_IMAGE" "$TEST_POSTGIS_IMAGE" "$TEST_WEB_IMAGE" "$TEST_API_IMAGE" >/dev/null 2>&1 || true
